# 태그(v*)를 올리면 빌드 → 단위 테스트 → Linux·Windows·Docker 묶음을 GitHub Release 에 올린다.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Unit tests
        run: cd backend && ./mvnw -q test
      - name: Build
        run: bash build.sh
      - name: Package
        run: python3 scripts/package.py "${GITHUB_REF_NAME#v}"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "WorkBlog $GITHUB_REF_NAME" --notes "설치 방법은 README 를 보세요. 초기 아이디: admin"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
