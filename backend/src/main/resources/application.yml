server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: workblog
  config:
    # 설치 프로그램이 만드는 설정 파일(키는 아래 ${...} 이름과 같다. 예: DB_URL=...). 없으면 무시.
    import: optional:file:${WORKBLOG_CONFIG:./config/workblog.properties}
  web:
    resources:
      # jar 안 정적 파일(프론트) + 서버 폴더(자체 호스팅 draw.io 등). 서버: /project/workblog/static-extra (컨테이너 /app/static-extra)
      static-locations: classpath:/static/,file:${EXTRA_STATIC_DIR:./static-extra}/
      # 캐시 기간은 두지 않는다(index.html 이 오래 캐시되면 새 설치가 화면에 늦게 반영). 빌드 자산은 이름에 해시가 있어 조건부 요청으로 충분.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workblog}
    username: ${DB_USERNAME:workblog}
    password: ${DB_PASSWORD:workblog}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_MB:25}MB
      max-request-size: ${MAX_FILE_MB:25}MB
  mail:
    # 메일 서버(SMTP). 보내기 자체는 workblog.mail.enabled 로 켠다.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: ${MAIL_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

workblog:
  # 문서·CLI 에 넣을 이 서버의 공개 주소(예: http://host:8070). 비우면 요청 주소를 쓴다.
  public-base-url: ${PUBLIC_BASE_URL:}
  jwt:
    # HS256 secret, >= 32 bytes. Override in production.
    secret: ${JWT_SECRET:workblog-dev-secret-change-me-please-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin1234}
    display-name: ${ADMIN_DISPLAY_NAME:관리자}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    # 첨부파일 저장 폴더. 서버에서는 /project/workblog/data/files (컨테이너 /app/data/files)
    dir: ${STORAGE_DIR:./data/files}
    max-file-mb: ${MAX_FILE_MB:25}
  signup:
    # 회원 가입 (2026-10-27 R13). 당분간 즉시 승인.
    enabled: ${SIGNUP_ENABLED:true}
    approval: ${SIGNUP_APPROVAL:false}
  mail:
    # 회원 관련 메일(가입·승인·계정 생성·회원 정보 수정·비밀번호 변경). 기본 끔. from 을 비우면 MAIL_USERNAME 을 쓴다.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:WorkBlog}
  security:
    # 새 비밀번호 최소 길이(글자 종류 제한 없음, 기존 계정 로그인에는 적용 안 함). 로그인 5회 연속 실패 시 10분 잠금은 고정값.
    password-min-length: ${PASSWORD_MIN_LENGTH:8}
  drawio:
    # 다이어그램(draw.io) 편집기. 브라우저가 이 주소를 열 수 있어야 한다.
    # 비우면 static-extra/drawio 가 있을 때 같은 서버의 /drawio(자체 호스팅, 폐쇄망용), 없으면 https://embed.diagrams.net
    url: ${DRAWIO_URL:}
  ops:
    # 운영 자동 정리(매일 03:30, com.workblog.ops). 휴지통 보존 일수 · 고아 첨부 보존 시간 · 자동 실행 여부
    trash-retention-days: ${TRASH_RETENTION_DAYS:30}
    orphan-attachment-hours: ${ORPHAN_ATTACHMENT_HOURS:24}
    cleanup-enabled: ${CLEANUP_ENABLED:true}
  datamove:
    # 데이터 이전(관리자 > 데이터 이전): 덤프 올리기 최대 크기(MB). 첨부 한도(MAX_FILE_MB)와 따로. 임시 폴더는 비우면 첨부 저장소 옆 imports
    import-max-mb: ${IMPORT_MAX_MB:2048}
    tmp-dir: ${IMPORT_TMP_DIR:}
    # 병합 폴더({저장소 상위}/import-on-start)를 보는 주기(ms). 데이터 동기화가 넣은 덤프를 재시작 없이 병합. 0 이면 기동 때만
    watch-ms: ${IMPORT_WATCH_MS:60000}
  review:
    # 오래된 글 재검토(com.workblog.review): 마지막 수정·내용 확인에서 이 일수가 지난 발행 글에 안내. 0 이면 끔
    stale-days: ${REVIEW_STALE_DAYS:180}

# API 문서: Swagger UI /swagger-ui/index.html, OpenAPI JSON /v3/api-docs
springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
  default-produces-media-type: application/json

logging:
  level:
    com.workblog: INFO
