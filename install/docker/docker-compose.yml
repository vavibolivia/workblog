# WorkBlog + PostgreSQL (Docker / Podman)
#   1. 이 폴더에서 .env 작성:  cp .env.example .env  후 비밀번호 바꾸기
#   2. docker compose up -d      (podman: podman-compose up -d)
#   3. http://localhost:8080  ·  초기 아이디 admin / 비밀번호 = .env 의 ADMIN_PASSWORD
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: workblog
      POSTGRES_USER: workblog
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 지정하세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workblog -d workblog"]
      interval: 5s
      retries: 20

  app:
    build:
      context: .
    image: workblog:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/workblog
      DB_USERNAME: workblog
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET(32자 이상)을 지정하세요}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env 에 ADMIN_PASSWORD 를 지정하세요}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      STORAGE_DIR: /app/data/files
      TZ: Asia/Seoul
    volumes:
      - files:/app/data/files

volumes:
  db-data:
  files:
